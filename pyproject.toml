[project]
name = "prime-spiral"
version = "0.1.0"
description = "Renders the Ulam/Sacks prime spiral to a PNG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax[cuda12]; sys_platform == 'linux'",
    "jax; sys_platform != 'linux'",
    "imageio",
]

[project.scripts]
prime-spiral = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py"]
